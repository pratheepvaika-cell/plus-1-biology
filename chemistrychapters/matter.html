                  - <strong>സംയുക്തങ്ങൾ (Compounds):</strong> രണ്ടോ അതിലധികമോ മൂലകങ്ങൾ <strong>നിശ്ചിത അനുപാതത്തിൽ രാസപരമായി</strong> ചേർന്നുണ്ടാവുന്നത് (ഉദാ: ജലം - H₂O, ഉപ്പ് - NaCl).<br><br>
                <strong>2. മിശ്രിതങ്ങൾ (Mixtures):</strong><br>
                • ഒന്നിലധികം ശുദ്ധ പദാർത്ഥങ്ങൾ <strong>ഏത് അനുപാതത്തിലും</strong> ചേർന്നുണ്ടാവുന്നവ. ഇവയെ രണ്ട് വിധത്തിൽ കാണാം:<br>
                  - <strong>ഏകരൂപ മിശ്രിതം / ഹോമോജീനിയസ് (Homogeneous):</strong> മിശ്രിതത്തിലുടനീളം പദാർത്ഥങ്ങൾ <strong>ഒരേ പോലെ</strong> അടങ്ങിയിരിക്കുന്നു (ഉദാ: ഉപ്പുവെള്ളം, പഞ്ചസാര ലായനി).<br>
                  - <strong>വിഭിന്നരൂപ മിശ്രിതം / ഹെട്രോജീനിയസ് (Heterogeneous):</strong> ഘടകങ്ങൾ <strong>വ്യക്തമായി തിരിച്ചറിയാൻ കഴിയുന്നവ</strong> (ഉദാ: മണ്ണും വെള്ളവും ചേർന്ന മിശ്രിതം, എണ്ണയും വെള്ളവും).

    function renderCards() {
        const grid = document.getElementById('cardsGridContainer');
        grid.innerHTML = '';
        
        for (let key in topicsData) {
            const item = topicsData[key][currentLang];
            const card = document.createElement('div');
            card.className = 'topic-card';
            card.onclick = () => openTopic(key);
            card.innerHTML = `<h3>${item.title}</h3><p>${item.desc}</p>`;
            grid.appendChild(card);
        }

        if (currentLang === 'en') {
            document.getElementById('mainHeading').innerText = "Some Basic Concepts of Chemistry";
            document.getElementById('introBannerText').innerText = "🧪 Select a topic below to view detailed exam notes with examples & questions.";
            document.getElementById('sectionTitleText').innerText = "Core Topics (1 to 4)";
            document.getElementById('langTriggerBtn').innerText = "മലയാളം";
            document.getElementById('langDetailTriggerBtn').innerText = "മലയാളം";
        } else {
            document.getElementById('mainHeading').innerText = "ചില അടിസ്ഥാന കെമിസ്ട്രി ആശയങ്ങൾ";
            document.getElementById('introBannerText').innerText = "🧪 താഴെയുള്ള ടോപ്പിക്കുകളിൽ ക്ലിക്ക് ചെയ്ത് ഹൈലൈറ്റ് ചെയ്ത പ്രധാന പോയിന്റുകളും ഉദാഹരണങ്ങളും വായിക്കുക.";
            document.getElementById('sectionTitleText').innerText = "പ്രധാന ഭാഗങ്ങൾ (1 മുതൽ 4 വരെ)";
            document.getElementById('langTriggerBtn').innerText = "English";
            document.getElementById('langDetailTriggerBtn').innerText = "English";
        }
    }

    function toggleLanguage() {
        currentLang = currentLang === 'en' ? 'ml' : 'en';
        renderCards();
    }

    function toggleLanguageDetail() {
        currentLang = currentLang === 'en' ? 'ml' : 'en';
        renderCards();
        if (activeTopicKey) {
            const topic = topicsData[activeTopicKey][currentLang];
            document.getElementById('topicTitleHeader').innerText = topic.title;
            document.getElementById('topicContentArea').innerHTML = topic.content;
        }
    }

    let activeTopicKey = null;

    function openTopic(sectionId) {
        activeTopicKey = sectionId;
        const topic = topicsData[sectionId][currentLang];
        document.getElementById('mainIndex').classList.add('hidden');
        document.getElementById('detailView').classList.add('active');
        
        document.getElementById('topicTitleHeader').innerText = topic.title;
        document.getElementById('topicContentArea').innerHTML = topic.content;
    }

    function goBack(event) {
        event.preventDefault();
        activeTopicKey = null;
        document.getElementById('detailView').classList.remove('active');
        document.getElementById('mainIndex').classList.remove('hidden');
    }

    renderCards();
</script>
